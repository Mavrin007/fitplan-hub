name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем старый запуск, если в ветку пришли новые коммиты, — не жжём минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Кэш npm (node_modules восстанавливается из ~/.npm) — ускоряет npm ci.
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Фейлим CI при high/critical уязвимостях в зависимостях.
      # Оставшиеся low (в цепочке AI SDK) аудит пропускает.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      # Фейлим при мёртвых файлах: каждый файл в src/components/ui/ должен
      # импортироваться хотя бы раз (кроме index.ts и *.test.*). Локально:
      #   npm run check:dead-files
      - name: Check for dead UI files
        run: npm run check:dead-files

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      # --- Покрытие: как проверять локально и как поднимать пороги ---
      #
      # Локально тот же гейт запускается командой:
      #   npm run test:coverage
      # (это `vitest run --coverage src/`; консольная таблица по файлам +
      # HTML-отчёт в coverage/index.html — открыть в браузере для разбора).
      #
      # Пороги живут в vitest.config.ts → coverage.thresholds (сейчас
      # lines: 80, branches: 75). CI фейлится, если любая метрика просела
      # ниже порога — это защита от регрессий, а не целевой показатель.
      #
      # Когда покрытие реально выросло (новая страница/модуль закрыты
      # тестами), порог поднимают вручную и отдельным коммитом, чтобы гейт
      # продолжал ужесточаться, а не молча отставал от фактических цифр:
      #   1. Запустить npm run test:coverage и посмотреть итоговые %.
      #   2. В vitest.config.ts поднять порог до ЦЕЛОЙ ЧАСТИ фактического
      #      значения с запасом ~2–5 пунктов (например, факт 84.3% строк →
      #      порог 80 остаётся, факт 87% → порог 82–85), чтобы тест с
      #      небольшим шумом не падал сам по себе.
      #   3. Закоммитить только изменение порога (без новых тестов в этом
      #      же коммите) — иначе откат тестов молча ослабит гейт.
      #
      # Слепые зоны: include: ["src/**"] замеряет весь src, поэтому новые
      # модули видны гейту сразу. Исключения (src/test, _generated, ассеты,
      # json) перечислены в vitest.config.ts — там же, где пороги.
      - name: Coverage
        run: npm run test:coverage

      # Собираем той же командой, что и Vercel (vercel.json buildCommand) —
      # локальная проверка = прод-сборка, никаких расхождений.
      # SEO-файлы (robots.txt/sitemap.xml) генерятся перед сборкой: в CI
      # задан SITE_URL, поэтому canonical/og:url указывают на прод-домен.
      - name: Generate SEO files
        run: node scripts/generate-seo.mjs

      - name: Build
        run: npm run build

  # Web Vitals (Lighthouse): против прод-сборки (vite preview из dist).
  # Страница для замера — публичный лендинг «/» (аутентифицированные
  # страницы требуют сессии, их перф замеряется e2e/первым экраном).
  # Chrome на ubuntu-latest уже установлен — chrome-launcher находит его сам.
  #
  # Пороги Web Vitals: заданы env ниже — при локальном запуске тот же скрипт
  # читает эти переменные (дефолты в scripts/lighthouse-check.mjs служат
  # фолбэком, когда env не задан, так что число одно на CI и локально):
  #   LCP < 2500 мс · FCP < 1800 мс · TBT < 300 мс · CLS < 0.1
  # Лучший из 2 прогонов — CI-раннеры шумят. Тюнинг порогов — только здесь
  # (или через repo/org env): если лендинг реально ускорился/замедлился,
  # правка одного числа вместо коммита в код.
  #
  # Мобильный сценарий (simulated Fast 4G + 4x CPU) даёт LCP ~4.4 с и
  # осознанно НЕ является гейтом: сначала сокращение бандла, затем гейт
  # подтягивают до mobile-simulate (см. README → Performance & Web Vitals).
  #
  # Отчёт (JSON + HTML) сохраняется в perf-report/ и загружается артефактом
  # даже при упавшем гейте — регрессию можно расследовать, а не только увидеть.
  perf:
    name: Web Vitals (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    # Запускаем и на push в main, и в PR — регрессии Web Vitals ловятся до мержа.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse (Web Vitals gate)
        env:
          PERF_LCP_MAX_MS: "2500"
          PERF_FCP_MAX_MS: "1800"
          PERF_TBT_MAX_MS: "300"
          PERF_CLS_MAX: "0.1"
        run: node scripts/lighthouse-check.mjs

      # Артефакт сохраняется даже при упавшем шаге выше (скрипт пишет отчёт
      # ДО проверки порогов): если гейт красный — в артефакте лежит почему.
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: perf-report
          if-no-files-found: error
          retention-days: 14

  # E2E (Playwright): полный локальный стек (convex dev + vite dev) поднимается
  # самим Playwright (webServer в playwright.config.ts). Прогоняются все
  # проекты: критический путь (e2e/critical-path.spec.ts), сквозной axe-аудит
  # доступности (e2e/a11y.spec.ts) и мобильная адаптивность без
  # горизонтального скролла (e2e/mobile.spec.ts, viewport 375px).
  # Локально: npm run test:e2e (см. .freebuff/run.md → “E2E (Playwright)”).
  e2e:
    name: E2E (critical path · axe · mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E требует локального Convex-бэкенда с auth-ключами и dev-OTP
      # (VLY_EMAIL_DEV_CAPTURE=1). Без настроенных env джоба честно падает —
      # это сигнал добавить ключи (см. run.md), а не тихий скип.
      - name: E2E (critical path · axe · mobile)
        run: npx playwright test

  # Деплой в продакшен: только push в основную ветку main, только после
  # зелёной проверки, и только если в репозитории настроены Vercel-секреты
  # (иначе шаги пропускаются — CI остаётся зелёным до подключения деплоя).
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    # Без GitHub Environment: отсутствие настроенного окружения/правил
    # защиты заставляло джобу висеть в очереди до ручного аппрува.
    # Секреты читаются из репозитория напрямую (см. env ниже).
    # Только push в main (дефолтная ветка репозитория) — PR-ы не деплоим.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Своя группа БЕЗ отмены: не прерываем идущий деплой новым пушем,
    # а даём ему завершиться (следующий запуск встанет в очередь).
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    # Секреты живут только в env: GitHub автоматически маскирует их в логах,
    # а Vercel CLI дополнительно прячет токен в выводе. Если секреты не заданы,
    # env-переменные пустые и шаги деплоя пропускаются (if: env.VERCEL_TOKEN != '').
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Deploy token для облачного Convex: создаётся в настройках проекта Convex
      # (Dashboard → Project → Settings → Deploy Keys). Без него шаг пропускается.
      CONVEX_DEPLOY_TOKEN: ${{ secrets.CONVEX_DEPLOY_TOKEN }}
      # Webhook для алертинга об упавшем деплое (Telegram bot URL, Slack
      # Incoming Webhook и т.п.) — см. шаг «Notify on failure» ниже.
      DEPLOY_ALERT_WEBHOOK: ${{ secrets.DEPLOY_ALERT_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Деплой функций бэкенда в облачный Convex (схема, функции, http-роуты).
      # Auth-переменные (JWT_PRIVATE_KEY, JWKS, …) и ключи ассистента
      # (GEMINI_API_KEY / VLY_INTEGRATION_KEY) задаются в панели Convex
      # (Dashboard → Environment Variables), а не в коде или CI-секретах, —
      # поэтому сюда попадать не должны. Sentry включается отдельно через
      # VITE_SENTRY_DSN в панели Vercel (в коде — только безопасный beforeSend).
      - name: Deploy to Convex
        if: env.CONVEX_DEPLOY_TOKEN != ''
        run: npx --no-install convex deploy

      # VITE_CONVEX_URL и другие env проекта подтягиваются из панели Vercel,
      # поэтому в GitHub их дублировать не нужно.
      # Версия CLI закреплена мажором (58) — воспроизводимые сборки.
      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@58 pull --yes --environment=production

      # Гард: не даём уехать «пустой» сборке — фейлим деплой, если
      # VITE_CONVEX_URL отсутствует, локальный (localhost/127.0.0.1) или не https.
      # vercel pull кладёт env из панели в .vercel/.env.production.local — его и проверяем.
      - name: Guard production env (VITE_CONVEX_URL)
        if: env.VERCEL_TOKEN != ''
        run: node scripts/guard-prod-env.mjs

      # vercel build сам выполняет сборку (vite build) с env из Vercel
      # и готовит .vercel/output для деплоя; папка dist остаётся на диске —
      # её загружаем как артефакт.
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@58 build --prod

      - name: Upload dist artifact
        if: env.VERCEL_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      # --prebuilt: деплоим уже собранный .vercel/output, ничего не пересобирая.
      # Захватываем URL деплоя (последний https-адрес в выводе) для смоук-теста.
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@58 deploy --prebuilt --prod 2>&1 | tee /tmp/vercel-deploy.log
          echo "DEPLOY_URL=$(grep -oE 'https://[^ ]+' /tmp/vercel-deploy.log | tail -1)" >> "$GITHUB_ENV"

      # Смоук-тест живого деплоя: главная страница и SPA-роут /dashboard
      # должны отвечать 200 (благодаря rewrites /dashboard тоже отдаёт index.html).
      - name: Smoke test deployed URL
        if: env.VERCEL_TOKEN != ''
        run: |
          test -n "$DEPLOY_URL" || { echo "::error::DEPLOY_URL пуст — деплой не удался"; exit 1; }
          curl -fsS -o /dev/null -w "GET $DEPLOY_URL -> %{http_code}\n" "$DEPLOY_URL"
          curl -fsS -o /dev/null -w "GET $DEPLOY_URL/dashboard -> %{http_code}\n" "$DEPLOY_URL/dashboard"

      # Алертинг об упавшем деплое: если любой шаг выше упал и задан webhook —
      # шлём уведомление со ссылкой на прогон. Без секрета шаг пропускается,
      # CI остаётся зелёным в локальных репозиториях без мониторинга.
      - name: Notify on deploy failure
        if: failure() && env.DEPLOY_ALERT_WEBHOOK != ''
        run: |
          curl -fsS -X POST "$DEPLOY_ALERT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔴 Deploy FAILED (${{ github.repository }})\n\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  # Staging: Vercel preview-деплой на каждый PR. Отдельного GitHub Environment
  # не нужно — preview-окружение Vercel и есть staging: каждый PR получает
  # уникальный URL, который смоук-тестируется и комментится в PR.
  #
  # Предусловие: в панели Vercel у проекта должен быть настроен preview-енв
  # с теми же переменными, что и production (VITE_CONVEX_URL и др.) — тогда
  # `vercel pull --environment=preview` их подтянет, а guard не упадёт.
  # Если preview-енв не настроен — джоба честно падает с понятной ошибкой
  # (сигнал дополнить preview-переменные), а не деплоит пустую сборку.
  deploy-preview:
    name: Deploy preview (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    # ВНИМАНИЕ: secrets НЕЛЬЗЯ использовать в job-level `if` — GitHub не
    # запускает воркфлоу вообще (0 джоб). Поэтому проверка токена живёт на
    # уровне шагов (`if: env.VERCEL_TOKEN != ''`), как в deploy-джобе выше.
    # PR из форков не видят секреты — preview-деплой работает для PR из
    # этого же репозитория (обычный сценарий одной команды).
    if: github.event_name == 'pull_request'
    concurrency:
      group: deploy-preview-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel preview settings
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@58 pull --yes --environment=preview

      # Гард: preview-сборка тоже обязана иметь валидный VITE_CONVEX_URL.
      # Скрипт принимает путь к env-файлу аргументом (см. scripts/guard-prod-env.mjs).
      - name: Guard preview env (VITE_CONVEX_URL)
        if: env.VERCEL_TOKEN != ''
        run: node scripts/guard-prod-env.mjs .vercel/.env.preview.local

      - name: Build (preview)
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@58 build --prebuilt

      # Без --prod: деплой уходит в preview-окружение (staging URL).
      - name: Deploy to Vercel preview
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@58 deploy --prebuilt 2>&1 | tee /tmp/vercel-preview.log
          echo "PREVIEW_URL=$(grep -oE 'https://[^ ]+' /tmp/vercel-preview.log | tail -1)" >> "$GITHUB_ENV"

      - name: Smoke test preview URL
        if: env.VERCEL_TOKEN != ''
        run: |
          test -n "$PREVIEW_URL" || { echo "::error::PREVIEW_URL пуст — деплой не удался"; exit 1; }
          curl -fsS -o /dev/null -w "GET $PREVIEW_URL -> %{http_code}\n" "$PREVIEW_URL"

      # Комментим staging-URL в PR, чтобы ревьюеру не искать его в Actions.
      - name: Comment preview URL on PR
        if: env.VERCEL_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "🟢 Preview (staging): $PREVIEW_URL"
