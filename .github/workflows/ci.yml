name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Отменяем старый запуск, если в ветку пришли новые коммиты, — не жжём минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Кэш npm (node_modules восстанавливается из ~/.npm) — ускоряет npm ci.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build
